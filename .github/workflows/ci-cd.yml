name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish and deploy, for example v0.1.2
        required: true
        type: string

env:
  NODE_VERSION: '22'
  REGISTRY_URL: 'https://npm.pkg.github.com'
  NPM_REGISTRY_URL: 'https://registry.npmjs.org'

jobs:
  test:
    name: Test Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests for postmessage-helper
        run: npm run test --workspace=@oslc/postmessage-helper || echo "No tests configured"

      - name: Build postmessage-helper
        run: npm run build --workspace=@oslc/postmessage-helper

      - name: Run tests for selection-webcomponent
        run: npm run test --workspace=@oslc/selection-webcomponent || echo "No tests configured"

      - name: Build selection-webcomponent
        run: npm run build --workspace=@oslc/selection-webcomponent

  build-and-publish:
    name: Build and Package
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and package postmessage-helper
        run: |
          npm run build --workspace=@oslc/postmessage-helper
          cd src/oslc-postmessage-helper
          
          # Create a pre-release version for main branch builds
          BASE_VERSION=$(npm pkg get version --workspace . | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          DEV_VERSION="${BASE_VERSION}-dev.${COMMIT_SHA}"
          echo "Creating development build: $DEV_VERSION"
          
          # Temporarily set the development version
          npm pkg set version="$DEV_VERSION"
          npm pack
          
          # Reset to original version
          npm pkg set version="$BASE_VERSION"

      - name: Build and package selection-webcomponent
        run: |
          npm run build --workspace=@oslc/selection-webcomponent
          cd src/oslc-selection-webcomponent
          
          # Create a pre-release version for main branch builds
          BASE_VERSION=$(npm pkg get version --workspace . | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          DEV_VERSION="${BASE_VERSION}-dev.${COMMIT_SHA}"
          echo "Creating development build: $DEV_VERSION"
          
          # Temporarily set the development version
          npm pkg set version="$DEV_VERSION"
          npm pack
          
          # Reset to original version
          npm pkg set version="$BASE_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: |
            src/oslc-postmessage-helper/dist/
            src/oslc-selection-webcomponent/dist/
            src/oslc-postmessage-helper/*.tgz
            src/oslc-selection-webcomponent/*.tgz

  deploy-demo:
    name: Deploy Demo to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build components for demo
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$WORKFLOW_EVENT" = "release" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          elif [ -n "$REQUESTED_RELEASE_TAG" ]; then
            RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          else
            RELEASE_TAG="999.9.9"
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          BUILD_VERSION="v${RELEASE_VERSION}+$(git rev-parse --short=7 HEAD)"
          export VITE_BUILD_VERSION="$BUILD_VERSION"
          echo "Building demo with version: $BUILD_VERSION"

          # Build both components using workspace commands
          npm run build --workspace=@oslc/postmessage-helper
          npm run build --workspace=@oslc/selection-webcomponent          
          npm run build --workspace=@oslc/selection-demo

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src/oslc-selection-demo/dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    name: Publish Release Packages
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Set up npm Trusted Publishing
        run: npm install --global npm@11.5.1

      - name: Configure npm for GitHub Packages
        run: |
          echo "@oslc:registry=${{ env.REGISTRY_URL }}" >> "$NPM_CONFIG_USERCONFIG"
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> "$NPM_CONFIG_USERCONFIG"

      - name: Extract version from release tag
        run: |
          RELEASE_TAG="${{ inputs.release_tag || github.ref_name }}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "Release version: $RELEASE_VERSION"

      - name: Prepare package metadata for publication
        run: |
          # Keep the repository and release tag on the stable placeholder
          # version. Substitute the release version only in this runner.
          npm version "$RELEASE_VERSION" --no-git-tag-version
          npm pkg set dependencies.@oslc/postmessage-helper="^$RELEASE_VERSION"
          npm pkg set dependencies.@oslc/selection-webcomponent="^$RELEASE_VERSION"

          # Update postmessage-helper version
          cd src/oslc-postmessage-helper
          npm version "$RELEASE_VERSION" --no-git-tag-version
          npm pkg set repository.url="git+https://github.com/${{ github.repository }}.git"
          npm pkg set repository.directory="src/oslc-postmessage-helper"
          npm pkg set publishConfig.access="public"
          
          cd ../oslc-selection-webcomponent
          # Update the helper dependency before npm version resolves this package.
          npm pkg set dependencies.@oslc/postmessage-helper="^$RELEASE_VERSION"
          # Update selection-webcomponent version
          npm version "$RELEASE_VERSION" --no-git-tag-version
          npm pkg set repository.url="git+https://github.com/${{ github.repository }}.git"
          npm pkg set repository.directory="src/oslc-selection-webcomponent"
          npm pkg set publishConfig.access="public"

      - name: Install dependencies
        run: npm install

      - name: Build postmessage-helper
        run: |
          npm run build --workspace=@oslc/postmessage-helper

      - name: Publish postmessage-helper to GitHub Packages
        run: |
          if npm view "@oslc/postmessage-helper@$RELEASE_VERSION" version --registry="${{ env.REGISTRY_URL }}" >/dev/null 2>&1; then
            echo "@oslc/postmessage-helper@$RELEASE_VERSION already exists on GitHub Packages"
          else
            npm publish --workspace=@oslc/postmessage-helper --registry=${{ env.REGISTRY_URL }} --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish postmessage-helper to npm
        run: |
          if npm view "@oslc/postmessage-helper@$RELEASE_VERSION" version --registry="${{ env.NPM_REGISTRY_URL }}" >/dev/null 2>&1; then
            echo "@oslc/postmessage-helper@$RELEASE_VERSION already exists on npm"
          else
            npm publish --workspace=@oslc/postmessage-helper --registry=${{ env.NPM_REGISTRY_URL }} --access public --tag latest
          fi

      - name: Build selection-webcomponent
        run: |
          npm run build --workspace=@oslc/selection-webcomponent

      - name: Publish selection-webcomponent to GitHub Packages
        run: |
          if npm view "@oslc/selection-webcomponent@$RELEASE_VERSION" version --registry="${{ env.REGISTRY_URL }}" >/dev/null 2>&1; then
            echo "@oslc/selection-webcomponent@$RELEASE_VERSION already exists on GitHub Packages"
          else
            npm publish --workspace=@oslc/selection-webcomponent --registry=${{ env.REGISTRY_URL }} --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish selection-webcomponent to npm
        run: |
          if npm view "@oslc/selection-webcomponent@$RELEASE_VERSION" version --registry="${{ env.NPM_REGISTRY_URL }}" >/dev/null 2>&1; then
            echo "@oslc/selection-webcomponent@$RELEASE_VERSION already exists on npm"
          else
            npm publish --workspace=@oslc/selection-webcomponent --registry=${{ env.NPM_REGISTRY_URL }} --access public --tag latest
          fi
