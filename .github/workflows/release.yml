name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.3
        required: true
        type: string

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  prepare-release:
    name: Prepare and tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up release variables
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi

          RELEASE_TAG="v$RELEASE_VERSION"
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Update release metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version
          npm pkg set dependencies.@oslc/postmessage-helper="^$RELEASE_VERSION"
          npm pkg set dependencies.@oslc/selection-webcomponent="^$RELEASE_VERSION"

          cd src/oslc-postmessage-helper
          npm version "$RELEASE_VERSION" --no-git-tag-version
          npm pkg set repository.url="git+https://github.com/${{ github.repository }}.git"
          npm pkg set repository.directory="src/oslc-postmessage-helper"
          npm pkg set publishConfig.access="public"

          cd ../oslc-selection-webcomponent
          npm version "$RELEASE_VERSION" --no-git-tag-version
          npm pkg set repository.url="git+https://github.com/${{ github.repository }}.git"
          npm pkg set repository.directory="src/oslc-selection-webcomponent"
          npm pkg set publishConfig.access="public"
          npm pkg set dependencies.@oslc/postmessage-helper="^$RELEASE_VERSION"

          cd ../..
          npm install --package-lock-only --ignore-scripts

      - name: Verify release build
        run: |
          npm install
          npm run test --workspace=@oslc/postmessage-helper || echo "No tests configured"
          npm run build --workspace=@oslc/postmessage-helper
          npm run test --workspace=@oslc/selection-webcomponent || echo "No tests configured"
          npm run build --workspace=@oslc/selection-webcomponent

      - name: Commit release metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            package-lock.json \
            src/oslc-postmessage-helper/package.json \
            src/oslc-selection-webcomponent/package.json
          git diff --cached --check
          git commit -m "chore: release $RELEASE_VERSION"

      - name: Tag exact release commit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE_TAG" \
            --generate-notes
